plugins {
    id 'com.android.library'
}

android {
    namespace = 'com.shilapi.ecarx.policy.sdk'
    compileSdk = 37
    defaultConfig { minSdk = 24 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

tasks.register('sdkJar', Jar) {
    archiveFileName = 'ecarx-policy-3.3.9-stubs.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(tasks.named('compileReleaseJavaWithJavac').flatMap { it.destinationDirectory })
}
